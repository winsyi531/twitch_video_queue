<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <title>Video Queue - 實況管理後台</title>
    <link rel="stylesheet" href="style.css">
    <script src="https://cdn.jsdelivr.net/npm/comfy.js@latest/dist/comfy.min.js"></script>
</head>
<body class="dark-theme">
    <header class="top-nav">
        <div class="logo">Video Queue <span>管理 YouTube 影片序列</span></div>
        <button id="fixPlayer" class="btn-primary">重置播放器 (解鎖自動播放)</button>
    </header>

    <div class="main-layout">
        <aside class="monitor-section">
            <div class="obs-player-container">
                <div id="obs-id-bar">
                    <span class="obs-tag" id="obs-video-id">等待影片中...</span>
                </div>
                
                <div class="obs-progress-container">
                    <div id="obs-progress-bar"></div>
                </div>
                
                <div id="player"></div>
            </div>

            <div class="card status-card">
                <h3>正在播放</h3>
                <div id="nowPlayingTitle">目前沒有播放中的影片</div>
            </div>
        </aside>

        <section class="queue-section">
            <div class="card">
                <div class="card-header">
                    <h3>等待佇列 (<span id="queueCount">0</span>)</h3>
                    <button id="clearList" class="btn-danger">清空清單</button>
                </div>
                <div class="list-container">
                    <table id="playlist">
                        <thead>
                            <tr>
                                <th>時間</th>
                                <th>提供者</th>
                                <th>影片 ID</th>
                            </tr>
                        </thead>
                        <tbody id="queueBody"></tbody>
                    </table>
                    <div id="emptyState" class="empty-msg">佇列為空，請從聊天室貼上連結</div>
                </div>
            </div>
        </section>
    </div>

    <footer class="settings-bar">
        <div class="setting-item">
            <label>自動播放</label>
            <button id="toggleAuto">OFF</button>
        </div>
        <div class="setting-item">
            <label>預設頻道</label>
            <input type="text" id="channelName" value="winsyi">
        </div>
    </footer>

    <script src="https://www.youtube.com/iframe_api"></script>
    <script src="script.js"></script>
</body>
</html>
