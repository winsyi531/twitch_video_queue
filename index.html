<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Twitch 影片點播</title>
<style>
:root{--bg:#f6f5f0;--fg:#1d1c26;--mut:#6a6878;--ac:#2f6bff;--card:#fff;--line:#d9d7e3}
@media (prefers-color-scheme:dark){:root{--bg:#15161c;--fg:#ecebf3;--mut:#9795a8;--ac:#7aa2ff;--card:#1f2029;--line:#34354380}}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--fg);font:16px/1.6 system-ui,"Noto Sans TC","PingFang TC","Microsoft JhengHei",sans-serif}
body.ov{background:transparent;overflow:hidden}
#setup{max-width:640px;margin:0 auto;padding:32px 20px 60px}
h1{font-size:1.6rem;margin:0 0 4px}
p.sub{color:var(--mut);margin:0 0 24px}
label{display:block;font-weight:600;margin:16px 0 4px}
small{display:block;color:var(--mut);font-weight:400}
input,select,button{font:inherit;width:100%;padding:10px 12px;border-radius:8px;border:1px solid var(--line);background:var(--card);color:var(--fg)}
button{background:var(--ac);color:#fff;border:0;font-weight:700;margin-top:20px;cursor:pointer}
button:focus-visible,input:focus-visible,select:focus-visible{outline:3px solid var(--ac);outline-offset:2px}
#out{margin-top:20px;padding:14px;border:1px dashed var(--ac);border-radius:8px;word-break:break-all;display:none}
#stage{position:fixed;left:50%;top:50%;transform:translate(-50%,-50%);width:min(calc(100vw - 2*var(--pad)),calc((100vh - 2*var(--pad) - var(--hh) - 2*var(--fw))*16/9));display:flex;flex-direction:column;border:var(--fw) solid var(--fc);border-radius:var(--fr);background:var(--fc);overflow:hidden;box-shadow:0 10px 40px rgba(0,0,0,.45);opacity:0;pointer-events:none;transition:opacity .4s}
#stage.on{opacity:1;pointer-events:auto}
#ctl{position:fixed;right:14px;bottom:8px;display:flex;align-items:center;gap:10px;padding:6px 14px;border-radius:999px;background:rgba(0,0,0,.75);color:#fff}
#ctl input{width:120px;padding:0;margin:0}
#snd{width:auto;margin:0;padding:2px 6px;border:0;background:transparent;color:#fff;font-weight:700;cursor:pointer}
#p{display:block;width:100%;height:100%;border:0}
#vid{aspect-ratio:16/9;background:#000}
#who{height:var(--hh);flex:none;display:flex;align-items:center;justify-content:space-between;gap:32px;padding:0 32px;color:var(--ft);font:700 var(--hf)/1 system-ui,'Noto Sans TC','Microsoft JhengHei',sans-serif;overflow:hidden}
#wn{min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
#wt{flex:none;font-variant-numeric:tabular-nums;white-space:nowrap}
:root{--fc:#7aa2ff;--ft:#0b1020;--fw:6px;--fr:20px;--pad:48px;--hh:110px;--hf:64px}
#dbg{position:fixed;top:8px;left:8px;max-width:90%;padding:8px 10px;background:rgba(0,0,0,.8);color:#9f9;font:12px/1.5 monospace;white-space:pre-wrap}
[hidden]{display:none!important}
:root{--on:#fff}@media (prefers-color-scheme:dark){:root{--on:#0b1020}}
#panel{max-width:560px;margin:0 auto;padding:14px}
#panel .hd{display:flex;align-items:center;gap:8px;color:var(--mut);font-size:.9rem;margin-bottom:12px}
#dot{width:10px;height:10px;border-radius:50%;background:#d6453d}
#dot.on{background:#2fb86b}
#panel h2{font-size:1rem;margin:18px 0 8px}
#panel ul{list-style:none;margin:0;padding:0}
#now{display:grid;grid-template-columns:96px 1fr auto;gap:10px;align-items:center;padding:10px;border:2px solid var(--ac);border-radius:10px;background:var(--card)}
#panel li{display:grid;grid-template-columns:72px 1fr auto;gap:10px;align-items:center;padding:8px 0;border-bottom:1px solid var(--line)}
#panel img{width:100%;aspect-ratio:16/9;object-fit:cover;border-radius:6px;background:var(--line)}
#panel .mt{min-width:0}
#panel .mt b{display:block;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
#panel .mt span{color:var(--mut);font-size:.85rem}
.pg{height:4px;background:var(--line);border-radius:2px;margin-top:6px}
.pg i{display:block;height:100%;width:0;background:var(--ac);border-radius:2px}
#panel button{width:auto;margin:0;padding:6px 10px;background:var(--card);color:var(--fg);border:1px solid var(--line);font-weight:600}
#panel button.pri{background:var(--ac);color:var(--on);border-color:var(--ac)}
#panel .bt{display:flex;gap:4px;flex-wrap:wrap;justify-content:flex-end}
#panel .add{display:flex;gap:8px;margin-top:16px}
#panel .add input{flex:1;width:auto}
#panel #clr{margin-top:12px}
#panel .vol{display:flex;align-items:center;gap:10px;margin-top:12px}
#panel .vol label{margin:0}
#panel .vol input{flex:1;width:auto;padding:0}
#panel .opt{display:flex;align-items:center;gap:12px;flex-wrap:wrap;margin-top:12px}
#panel .opt label{display:flex;align-items:center;gap:6px;margin:0}
#panel .opt input{width:auto;padding:0;margin:0}
#panel .opt select{width:auto;flex:1;min-width:90px;padding:6px 8px}

:root{--vw:1920px;--ml:30px;--mt:30px;--gap:20px;--mr:30px;--mb:30px;--sw:calc(var(--vw) + 2*var(--fw));--sh:calc(var(--hh) + var(--vw)*9/16 + 2*var(--fw))}
body.ui #stage{left:var(--ml);top:var(--mt);transform:none;width:var(--sw)}
#ui{position:fixed;inset:0;pointer-events:none;opacity:0;transition:opacity .35s;font:22px/1.4 system-ui,"Noto Sans TC","Microsoft JhengHei",sans-serif;color:#eceaf4}
#ui.act{opacity:1}
#ui>div{position:fixed;pointer-events:auto;background:#1a1b23;border:1px solid #3a3b4a;border-radius:16px;padding:16px}
#ui button{width:auto;margin:0;padding:.3em .8em;background:#2b2d3b;color:#eceaf4;border:1px solid #444659;border-radius:10px;font-size:1em;font-weight:600;cursor:pointer}
#ui button.pri{background:#7aa2ff;color:#0b1020;border-color:#7aa2ff}
#ui input,#ui select{width:auto;padding:.3em .6em;background:#2b2d3b;color:#eceaf4;border:1px solid #444659;border-radius:10px;font-size:1em}
#ui input[type=range]{width:200px;padding:0}
#ui input[type=checkbox]{width:1em;height:1em;padding:0}
#ui label{display:flex;align-items:center;gap:.4em;margin:0;font-weight:500}
#side{left:calc(var(--ml) + var(--sw) + var(--gap));top:var(--mt);right:var(--mr);height:var(--sh);display:flex;flex-direction:column}
#side h3{margin:0;font-size:1.05em}
#ulist{list-style:none;margin:8px 0 0;padding:0;overflow-y:auto;flex:1}
#ulist li{display:grid;grid-template-columns:128px 1fr;gap:4px 12px;align-items:start;padding:10px 0;border-bottom:1px solid #34354a}
#ulist img{grid-row:1/3;width:100%;aspect-ratio:16/9;object-fit:cover;border-radius:6px;background:#34354a}
#ulist .mt{min-width:0}
#ulist .mt b{display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;font-size:.85em;line-height:1.3}
#ulist .mt span{color:#9b99ad;font-size:.8em}
#ulist .bt{display:flex;gap:6px}
#ulist .bt button{padding:.15em .6em}
#uempty{color:#9b99ad;margin-top:12px}
#bottom{left:var(--ml);top:calc(var(--mt) + var(--sh) + var(--gap));width:var(--sw);bottom:var(--mb);display:flex;flex-direction:column;gap:10px;overflow:hidden}
#bottom .row{display:flex;align-items:center;gap:16px}
#bottom .now{flex:1;min-width:0}
#bottom .now b{display:block;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
#bottom .now span{color:#9b99ad;font-size:.8em}
#upg{height:8px;background:#34354a;border-radius:4px;flex:none}
#upg i{display:block;height:100%;width:0;background:#7aa2ff;border-radius:4px}
#uurl{flex:1;min-width:0}
</style>
</head>
<body>
<div id="setup" hidden>
  <h1>影片點播 Overlay 設定</h1>
  <p class="sub">填完後複製產生的網址，貼到 OBS 的「瀏覽器」來源。</p>
  <label for="f-ch">Twitch 頻道名稱</label>
  <input id="f-ch" value="winsyi" autocomplete="off">
  <label for="f-rw">頻道點數獎勵 ID（選填）<small>留空 = 任何「需要輸入文字」且含 YouTube 連結的兌換都接受。不知道 ID？先產生網址後加上 &amp;debug=1，兌換一次就會顯示。</small></label>
  <input id="f-rw" autocomplete="off">
  <label for="f-who">誰可以用 !vq</label>
  <select id="f-who"><option value="all">所有人</option><option value="sub">訂閱者以上</option><option value="vip">VIP 以上</option><option value="mod">只有管理員</option></select>
  <label for="f-max">每支影片最長播放秒數</label>
  <input id="f-max" type="number" value="1200" min="10">
  <label for="f-cd">每人 !vq 冷卻秒數</label>
  <input id="f-cd" type="number" value="60" min="0">
  <button id="gen" type="button">產生 OBS 網址</button>
  <div id="out"></div>
</div>

<div id="panel" hidden>
  <div class="hd"><span id="dot"></span><span id="stat">連線中…</span></div>
  <div id="now" hidden>
    <img id="th" alt="">
    <div class="mt"><b id="nt"></b><span id="nu"></span><div class="pg"><i id="bar"></i></div></div>
    <div class="bt"><button id="pr" class="pri" type="button">暫停</button><button id="sk" type="button">跳過</button></div>
  </div>
  <div class="vol"><label for="vol">🔊 音量</label><input id="vol" type="range" min="0" max="100" value="50"><span id="vv">50</span></div>
  <div class="opt"><label for="cc"><input id="cc" type="checkbox"> 顯示字幕</label><label for="qs">畫質</label><select id="qs"><option value="hd1080">1080p</option><option value="hd720">720p</option><option value="large">480p</option><option value="medium">360p</option><option value="auto">自動</option></select></div>
  <h2>待播 <span id="cnt"></span></h2>
  <ul id="list"></ul>
  <p id="empty" class="sub">佇列是空的。觀眾兌換獎勵或打 !vq 後會出現在這裡。</p>
  <div class="add"><input id="url" placeholder="貼上 YouTube 連結手動加入"><button id="addb" class="pri" type="button">加入</button></div>
  <button id="clr" type="button">清空待播</button>
</div>
<div id="stage"><div id="who"><span id="wn"></span><span id="wt"></span></div><div id="vid"><div id="p"></div></div></div>
<div id="ctl" hidden><button id="snd" type="button" hidden>🔊 點一下開啟聲音</button><input id="cv" type="range" min="0" max="100" aria-label="音量"></div>
<div id="ui" hidden>
  <div id="side"><h3>待播 <span id="ucnt"></span></h3><ul id="ulist"></ul><p id="uempty">佇列是空的</p></div>
  <div id="bottom">
    <div class="row">
      <div class="now"><b id="unt">目前沒有播放</b><span id="unu"></span></div>
      <button id="upr" class="pri" type="button">暫停</button><button id="usk" type="button">跳過</button>
      <label for="uvol">🔊 <input id="uvol" type="range" min="0" max="100"><span id="uvv"></span></label>
      <label for="ucc"><input id="ucc" type="checkbox"> 字幕</label>
      <select id="uqs" aria-label="畫質"><option value="hd1080">1080p</option><option value="hd720">720p</option><option value="large">480p</option><option value="medium">360p</option><option value="auto">自動</option></select>
    </div>
    <div id="upg"><i id="ubar"></i></div>
    <div class="row"><input id="uurl" placeholder="貼上 YouTube 連結手動加入"><button id="uadd" class="pri" type="button">加入</button><button id="uclr" type="button">清空待播</button></div>
  </div>
</div>
<div id="dbg" hidden></div>

<script>
const q = new URLSearchParams(location.search);
const ch = q.get('setup') === '1' ? '' : (q.get('channel') || 'winsyi').toLowerCase().replace('#', '').trim();

if (!ch) {
  const s = document.getElementById('setup'); s.hidden = false;
  document.getElementById('gen').onclick = () => {
    const c = document.getElementById('f-ch').value.trim().toLowerCase().replace('#', '');
    if (!c) { document.getElementById('f-ch').focus(); return; }
    const p = new URLSearchParams({ channel: c, who: document.getElementById('f-who').value,
      max: document.getElementById('f-max').value, cd: document.getElementById('f-cd').value });
    const r = document.getElementById('f-rw').value.trim(); if (r) p.set('reward', r);
    const o = document.getElementById('out'); o.style.display = 'block';
    const base = location.origin + location.pathname; o.textContent = '';
    [['OBS 瀏覽器來源（播放 + 內建控制，建議）', base + '?' + p + '&ui=1'], ['OBS 瀏覽器來源（只播放）', base + '?' + p], ['OBS 自訂瀏覽器面板（管理佇列）', base + '?panel=1&channel=' + c]].forEach(([t, u]) => {
      const d = document.createElement('div'); d.style.marginBottom = '12px';
      d.innerHTML = '<b></b><br><span></span>'; d.firstChild.textContent = t; d.lastChild.textContent = u; o.appendChild(d); });
  };
} else if (q.get('panel') === '1') {
  const $ = id => document.getElementById(id);
  $('panel').hidden = false;
  const bc = new BroadcastChannel('vq-' + ch);
  const send = (cmd, uid, url, v) => bc.postMessage({ type: 'cmd', cmd, uid, url, v });
  const titles = {};
  let st = null, seen = 0, sig = null, armed = 0;
  const thumb = id => 'https://i.ytimg.com/vi/' + id + '/mqdefault.jpg';
  function ti(id) {
    if (!(id in titles)) {
      titles[id] = '';
      fetch('https://noembed.com/embed?url=' + encodeURIComponent('https://www.youtube.com/watch?v=' + id))
        .then(r => r.json()).then(j => { if (j.title) { titles[id] = j.title; sig = null; draw(); } }).catch(() => {});
    }
    return titles[id] || id;
  }
  function draw() {
    const live = Date.now() - seen < 3500;
    $('dot').className = live ? 'on' : '';
    $('stat').textContent = live ? '已連線到 overlay（' + ch + '）' : '找不到 overlay，請確認 OBS 來源已載入';
    const c = st && st.cur, list = st ? st.queue : [];
    if (st && document.activeElement !== $('vol')) { $('vol').value = st.vol; $('vv').textContent = st.vol; }
    if (st) { if (document.activeElement !== $('cc')) $('cc').checked = !!st.cc; if (document.activeElement !== $('qs')) $('qs').value = st.qual; }
    $('now').hidden = !c;
    if (c) {
      $('nt').textContent = ti(c.id); $('nu').textContent = c.user + ' 點播'; $('th').src = thumb(c.id);
      $('bar').style.width = st.dur ? Math.min(100, st.pos / st.dur * 100) + '%' : '0%';
      $('pr').textContent = st.paused ? '繼續' : '暫停';
    }
    $('cnt').textContent = list.length ? '（' + list.length + '）' : '';
    $('empty').hidden = list.length > 0;
    const s = list.map(x => x.uid + (titles[x.id] ? 1 : 0)).join(',');
    if (s === sig) return;
    sig = s;
    const ul = $('list'); ul.textContent = '';
    list.forEach(x => {
      const li = document.createElement('li'); li.dataset.uid = x.uid;
      li.innerHTML = '<img alt=""><div class="mt"><b></b><span></span></div><div class="bt"><button data-c="now" title="立即播放">▶</button><button data-c="up" title="上移">↑</button><button data-c="down" title="下移">↓</button><button data-c="remove" title="移除">✕</button></div>';
      li.querySelector('img').src = thumb(x.id);
      li.querySelector('b').textContent = ti(x.id);
      li.querySelector('span').textContent = x.user + ' 點播';
      ul.appendChild(li);
    });
  }
  $('list').onclick = e => { const b = e.target.closest('button'); if (b) send(b.dataset.c, b.closest('li').dataset.uid); };
  $('pr').onclick = () => send(st && st.paused ? 'resume' : 'pause');
  $('sk').onclick = () => send('skip');
  $('cc').onchange = e => send('cc', null, null, e.target.checked ? 1 : 0);
  $('qs').onchange = e => send('qual', null, e.target.value);
  $('vol').oninput = e => { $('vv').textContent = e.target.value; send('vol', null, null, +e.target.value); };
  $('clr').onclick = e => {
    if (armed) { send('clear'); armed = 0; e.target.textContent = '清空待播'; return; }
    armed = 1; e.target.textContent = '再按一次確認清空';
    setTimeout(() => { armed = 0; $('clr').textContent = '清空待播'; }, 3000);
  };
  $('addb').onclick = () => { const v = $('url').value.trim(); if (v) { send('add', null, v); $('url').value = ''; } };
  $('url').onkeydown = e => { if (e.key === 'Enter') $('addb').click(); };
  bc.onmessage = e => { if (e.data && e.data.type === 'state') { st = e.data.st; seen = Date.now(); draw(); } };
  send('hello'); setInterval(draw, 1000);
} else {
  document.body.classList.add('ov');
  if (q.get('color')) document.documentElement.style.setProperty('--fc', '#' + q.get('color').replace('#', ''));
  const CFG = { reward: q.get('reward') || '', who: q.get('who') || 'all', max: +q.get('max') || 1200,
    cd: +q.get('cd') || 60, qmax: +q.get('qmax') || 20, debug: q.get('debug') === '1' };
  const ui = q.get('ui') === '1';
  const queue = [], lastUse = {};
  let player, ready = false, cur = null, timer = null, kick = null, capEnd = 0;
  const bc = new BroadcastChannel('vq-' + ch), KEY = 'vq-state-' + ch;
  let vol = 50; try { const v = localStorage.getItem('vq-vol-' + ch); if (v !== null) vol = +v; } catch (e) {}
  const ld = (k, d) => { try { const v = localStorage.getItem(k + ch); return v === null ? d : v; } catch (e) { return d; } };
  const sv = (k, v) => { try { localStorage.setItem(k + ch, v); } catch (e) {} };
  let cc = ld('vq-cc-', '0') === '1', qual = ld('vq-qual-', 'hd1080'), optsFor = null;
  function applyOpts() {
    if (!ready) return;
    try { ['captions', 'cc'].forEach(mod => cc ? player.loadModule(mod) : player.unloadModule(mod)); } catch (e) {}
    try { if (qual !== 'auto') { if (player.setPlaybackQualityRange) player.setPlaybackQualityRange(qual, qual); player.setPlaybackQuality(qual); } } catch (e) {}
  }
  const inObs = !!window.obsstudio;
  function setVol(v) {
    vol = Math.max(0, Math.min(100, v | 0)); cv.value = vol;
    if (ready) player.setVolume(vol);
    try { localStorage.setItem('vq-vol-' + ch, vol); } catch (e) {}
    pub();
  }
  const uid = () => Date.now().toString(36) + Math.random().toString(36).slice(2, 6);
  try { const r = JSON.parse(localStorage.getItem(KEY) || 'null');
    if (r && Date.now() - r.t < 6 * 3600e3) { if (r.cur) queue.push(r.cur); queue.push(...r.queue); } } catch (e) {}
  function pub() {
    const on = ready && cur;
    bc.postMessage({ type: 'state', st: { cur, queue, vol, cc, qual, paused: !!on && player.getPlayerState() === 2,
      pos: on ? player.getCurrentTime() || 0 : 0, dur: on ? player.getDuration() || 0 : 0 } });
    drawUi();
  }
  function changed() { render(); pub(); try { localStorage.setItem(KEY, JSON.stringify({ cur, queue, t: Date.now() })); } catch (e) {} }
  bc.onmessage = e => { if (e.data && e.data.type === 'cmd') cmd(e.data); };
  function cmd(m) {
    const i = queue.findIndex(x => x.uid === m.uid);
    const swap = (a, b) => { [queue[a], queue[b]] = [queue[b], queue[a]]; changed(); };
    if (m.cmd === 'skip') advance();
    else if (m.cmd === 'clear') { queue.length = 0; changed(); }
    else if (m.cmd === 'remove' && i > -1) { queue.splice(i, 1); changed(); }
    else if (m.cmd === 'up' && i > 0) swap(i, i - 1);
    else if (m.cmd === 'down' && i > -1 && i < queue.length - 1) swap(i, i + 1);
    else if (m.cmd === 'now' && i > -1) { queue.unshift(queue.splice(i, 1)[0]); advance(); }
    else if (m.cmd === 'pause' && ready) player.pauseVideo();
    else if (m.cmd === 'resume' && ready) player.playVideo();
    else if (m.cmd === 'vol') setVol(m.v);
    else if (m.cmd === 'cc') { cc = !!m.v; sv('vq-cc-', cc ? 1 : 0); applyOpts(); pub(); }
    else if (m.cmd === 'qual') { qual = m.url || 'auto'; sv('vq-qual-', qual); applyOpts(); pub(); }
    else if (m.cmd === 'add') { const v = parse(m.url || ''); if (v) { queue.push({ ...v, user: '主播', uid: uid() }); if (!cur) advance(); else changed(); } }
    else pub();
  }
  setInterval(pub, 1000);
  const stage = document.getElementById('stage'), wn = document.getElementById('wn'), wt = document.getElementById('wt'), ctl = document.getElementById('ctl'), cv = document.getElementById('cv'), snd = document.getElementById('snd'), dbg = document.getElementById('dbg');
  const log = t => { if (!CFG.debug) return; dbg.hidden = false; dbg.textContent = (dbg.textContent + '\n' + t).split('\n').slice(-8).join('\n'); };
  const U = ui ? { root: ui_('ui'), nt: ui_('unt'), nu: ui_('unu'), pr: ui_('upr'), sk: ui_('usk'), vol: ui_('uvol'), vv: ui_('uvv'), cc: ui_('ucc'), qs: ui_('uqs'),
    bar: ui_('ubar'), url: ui_('uurl'), add: ui_('uadd'), clr: ui_('uclr'), list: ui_('ulist'), cnt: ui_('ucnt'), empty: ui_('uempty') } : null;
  function ui_(id) { return document.getElementById(id); }
  const titles = {}; let usig = '', armed = 0;
  const thumb = id => 'https://i.ytimg.com/vi/' + id + '/mqdefault.jpg';
  function ti(id) {
    if (!(id in titles)) {
      titles[id] = '';
      fetch('https://noembed.com/embed?url=' + encodeURIComponent('https://www.youtube.com/watch?v=' + id))
        .then(r => r.json()).then(j => { if (j.title) { titles[id] = j.title; usig = null; drawUi(); } }).catch(() => {});
    }
    return titles[id] || id;
  }
  function drawUi() {
    if (!ui) return;
    const on = ready && cur;
    U.nt.textContent = cur ? ti(cur.id) : '目前沒有播放';
    U.nu.textContent = cur ? cur.user + ' 點播' : '';
    const d = on ? player.getDuration() || 0 : 0, p = on ? player.getCurrentTime() || 0 : 0;
    U.bar.style.width = d ? Math.min(100, p / d * 100) + '%' : '0%';
    U.pr.textContent = on && player.getPlayerState() === 2 ? '繼續' : '暫停';
    if (document.activeElement !== U.vol) U.vol.value = vol;
    U.vv.textContent = vol;
    if (document.activeElement !== U.cc) U.cc.checked = cc;
    if (document.activeElement !== U.qs) U.qs.value = qual;
    U.cnt.textContent = queue.length ? '（' + queue.length + '）' : '';
    U.empty.hidden = queue.length > 0;
    const sig = queue.map(x => x.uid + (titles[x.id] ? 1 : 0)).join(',');
    if (sig === usig) return;
    usig = sig;
    U.list.textContent = '';
    queue.forEach(x => {
      const li = document.createElement('li'); li.dataset.uid = x.uid;
      li.innerHTML = '<img alt=""><div class="mt"><b></b><span></span></div><div class="bt"><button data-c="now" title="立即播放">▶</button><button data-c="up" title="上移">↑</button><button data-c="down" title="下移">↓</button><button data-c="remove" title="移除">✕</button></div>';
      li.querySelector('img').src = thumb(x.id);
      li.querySelector('b').textContent = ti(x.id);
      li.querySelector('span').textContent = x.user + ' 點播';
      U.list.appendChild(li);
    });
  }
  function initUi() {
    document.body.classList.add('ui'); U.root.hidden = false;
    U.list.onclick = e => { const b = e.target.closest('button'); if (b) cmd({ cmd: b.dataset.c, uid: b.closest('li').dataset.uid }); };
    U.pr.onclick = () => cmd({ cmd: ready && cur && player.getPlayerState() === 2 ? 'resume' : 'pause' });
    U.sk.onclick = () => cmd({ cmd: 'skip' });
    U.vol.oninput = e => cmd({ cmd: 'vol', v: +e.target.value });
    U.cc.onchange = e => cmd({ cmd: 'cc', v: e.target.checked ? 1 : 0 });
    U.qs.onchange = e => cmd({ cmd: 'qual', url: e.target.value });
    U.add.onclick = () => { const v = U.url.value.trim(); if (v) { cmd({ cmd: 'add', url: v }); U.url.value = ''; } };
    U.url.onkeydown = e => { if (e.key === 'Enter') U.add.onclick(); };
    U.clr.onclick = () => {
      if (armed) { cmd({ cmd: 'clear' }); armed = 0; U.clr.textContent = '清空待播'; return; }
      armed = 1; U.clr.textContent = '再按一次確認清空';
      setTimeout(() => { armed = 0; U.clr.textContent = '清空待播'; }, 3000);
    };
    if (q.get('fade') === '0') U.root.classList.add('act');
    else {
      let ft; const act = () => { U.root.classList.add('act'); clearTimeout(ft); ft = setTimeout(() => U.root.classList.remove('act'), 6000); };
      ['mousemove', 'mousedown', 'keydown', 'wheel'].forEach(ev => document.addEventListener(ev, act));
    }
    drawUi();
  }
  const ROLE = { all: /^/, sub: /subscriber|founder|vip|moderator|broadcaster/, vip: /vip|moderator|broadcaster/, mod: /moderator|broadcaster/ };

  function parse(text) {
    const m = text.match(/(?:youtu\.be\/|youtube\.com\/(?:watch\?(?:\S*&)?v=|shorts\/|embed\/|live\/))([\w-]{11})/i);
    if (!m) return null;
    const t = text.match(/[?&#](?:t|start)=(\d+)/);
    return { id: m[1], start: t ? +t[1] : 0 };
  }
  function render() {
    stage.classList.toggle('on', !!cur);
    snd.hidden = !(cur && ready && player.isMuted());
    if (cur) wn.textContent = cur.user;
  }
  function show() {
    if (!ready) return;
    clearTimeout(kick);
    if (cur) {
      player.loadVideoById({ videoId: cur.id, startSeconds: cur.start });
      const id = cur.uid;
      kick = setTimeout(() => {
        const st = player.getPlayerState();
        if (cur && cur.uid === id && (st === -1 || st === 5)) { if (!inObs) player.mute(); player.playVideo(); render(); }
      }, 2500);
    } else player.stopVideo();
  }
  function advance() { clearTimeout(timer); timer = null; capEnd = 0; wt.textContent = ''; cur = queue.shift() || null; changed(); show(); }

  function onMsg(tags, user, text) {
    const badges = tags.badges || '';
    const isMod = /broadcaster|moderator/.test(badges);
    const cmd = text.trim().split(/\s+/)[0].toLowerCase();
    if (isMod && cmd === '!vskip') return advance();
    if (isMod && cmd === '!vclear') { queue.length = 0; return advance(); }
    const rid = tags['custom-reward-id'];
    if (rid) log('reward id: ' + rid);
    let ok = false;
    if (rid) ok = !CFG.reward || rid === CFG.reward;
    else if (cmd === '!vq') ok = ROLE[CFG.who].test(badges);
    if (!ok) return;
    const v = parse(text);
    if (!v) return;
    const now = Date.now();
    if (!rid && !isMod && now - (lastUse[user] || 0) < CFG.cd * 1000) return;
    if (queue.length >= CFG.qmax) return;
    lastUse[user] = now;
    queue.push({ ...v, user, uid: uid() });
    if (!cur) advance(); else changed();
  }

  window.onYouTubeIframeAPIReady = () => {
    player = new YT.Player('p', { width: '100%', height: '100%',
      playerVars: { autoplay: 1, playsinline: 1, rel: 0, controls: q.get('controls') === '1' ? 1 : 0, cc_load_policy: 0, iv_load_policy: 3, modestbranding: 1, origin: location.origin },
      events: {
        onReady: () => { ready = true; player.setVolume(vol); if (!cur && queue.length) advance(); else show(); },
        onStateChange: e => {
          if (e.data === 0) advance();
          if (e.data === 1) render();
          if (e.data === 1 && cur && optsFor !== cur.uid) { optsFor = cur.uid; applyOpts(); setTimeout(applyOpts, 1500); }
          if (e.data === 1 && !timer) { timer = setTimeout(advance, CFG.max * 1000); capEnd = Date.now() + CFG.max * 1000; }
        },
        onError: () => advance()
      } });
  };
  const sc = document.createElement('script'); sc.src = 'https://www.youtube.com/iframe_api'; document.head.appendChild(sc);

  snd.onclick = () => { player.unMute(); player.playVideo(); render(); };
  function connect() {
    const ws = new WebSocket('wss://irc-ws.chat.twitch.tv:443');
    ws.onopen = () => {
      ws.send('CAP REQ :twitch.tv/tags twitch.tv/commands');
      ws.send('PASS SCHMOOPIIE');
      ws.send('NICK justinfan' + (10000 + Math.random() * 80000 | 0));
      ws.send('JOIN #' + ch);
      log('已連線 #' + ch);
    };
    ws.onmessage = e => e.data.split('\r\n').forEach(l => {
      if (!l) return;
      if (l.startsWith('PING')) return ws.send('PONG :tmi.twitch.tv');
      const m = l.match(/^@(\S+) :(\w+)!\S+ PRIVMSG #\S+ :(.*)$/);
      if (!m) return;
      const tags = {};
      m[1].split(';').forEach(p => { const i = p.indexOf('='); tags[p.slice(0, i)] = p.slice(i + 1); });
      onMsg(tags, tags['display-name'] || m[2], m[3]);
    });
    ws.onclose = () => { log('斷線，3 秒後重連'); setTimeout(connect, 3000); };
  }
  ctl.hidden = inObs; cv.value = vol;
  cv.oninput = e => setVol(+e.target.value);
  function fmt(t) {
    t = Math.max(0, Math.ceil(t));
    const h = t / 3600 | 0, m = (t % 3600) / 60 | 0, r = t % 60;
    return (h ? h + ':' + String(m).padStart(2, '0') : m) + ':' + String(r).padStart(2, '0');
  }
  function tick() {
    if (!cur || !ready) { wt.textContent = ''; return; }
    let rem = Infinity;
    try { const d = player.getDuration() || 0, c = player.getCurrentTime() || 0; if (d > 0) rem = d - c; } catch (e) {}
    if (capEnd) rem = Math.min(rem, (capEnd - Date.now()) / 1000);
    wt.textContent = isFinite(rem) ? fmt(rem) : '';
  }
  setInterval(tick, 500);
  if (ui) initUi();
  connect();
}
</script>
</body>
